[default]
input = /lcrc/group/e3sm/ac.ngmahfouz/v2.LR/run.v2.LR.F2010.ospa
output = /lcrc/group/e3sm/ac.ngmahfouz/v2.LR/run.v2.LR.F2010.ospa
case = run.v2.LR.F2010.ospa
www = /lcrc/group/e3sm/public_html/diagnostic_output/ac.ngmahfouz/v2.LR
partition = compute
environment_commands = "source /lcrc/soft/climate/e3sm-unified/load_latest_e3sm_unified_chrysalis.sh"
plugins = "chemdyg",

[climo]
active = True
walltime = "1:00:00"
years = "2010:2039:30"
input_subdir = "archive/atm/hist"

  [[ atm_monthly_180x360_aave ]]
  input_files = "eam.h0"
  mapping_file = /home/ac.zender/data/maps/map_ne30pg2_to_cmip6_180x360_aave.20200201.nc
  frequency = "monthly"

  [[ atm_monthly_diurnal_8xdaily_180x360_aave ]]
  input_files = "eam.h3"
  mapping_file = /home/ac.zender/data/maps/map_ne30pg2_to_cmip6_180x360_aave.20200201.nc
  vars = "PRECT"
  frequency = "diurnal_8xdaily"

  [[ 180x360_aave ]]

  [[ native_aave ]]
  grid = 'native'

  [[ nativ_aave ]]
  grid = 'native'
  input_files = "eam.h7"

  [[ land_monthly_180x360_aave]]

[ts]
active = True
walltime = "0:30:00"
years = "2010:2039:30"

  [[ atm_monthly_180x360_aave ]]
  input_files = "eam.h0"
  mapping_file = /home/ac.zender/data/maps/map_ne30pg2_to_cmip6_180x360_aave.20200201.nc
  frequency = "monthly"

  [[ atm_daily_180x360_aave ]]
  input_files = "eam.h1"
  mapping_file = /home/ac.zender/data/maps/map_ne30pg2_to_cmip6_180x360_aave.20200201.nc
  frequency = "daily"
  vars = "PRECT"

  [[ atm_monthly_glb ]]
  input_files = "eam.h0"
  mapping_file = "glb"
  frequency = "monthly"

  [[ atm_hourly_US1.0x1.0_nco ]]
  mapping_file = /home/ac.zender/data/maps/map_ne30pg2_to_MDA8US1.0x1.0_nco.20211202.nc
  input_files = "eam.h4"
  frequency = "hourly"
  vars = "O3_SRF"
  dpf = 10
  tpd = 24

  [[ atm_hourly_EU1.0x1.0_nco ]]
  mapping_file = /home/ac.zender/data/maps/map_ne30pg2_to_MDA8EU1.0x1.0_nco.20211202.nc
  input_files = "eam.h4"
  frequency = "hourly"
  vars = "O3_SRF"
  dpf = 10
  tpd = 24

[e3sm_diags]
active = True
years = "2010:2039:30"
ts_num_years = 30
ref_start_yr = 1979
ref_final_yr = 2016

  [[ atm_monthly_180x360_aave ]]
  short_name = 'run.v2.LR.F2010.ospa'
  grid = '180x360_aave'
  reference_data_path = '/lcrc/soft/climate/e3sm_diags_data/obs_for_e3sm_diags/climatology'
  obs_ts = '/lcrc/soft/climate/e3sm_diags_data/obs_for_e3sm_diags/time-series'
  dc_obs_climo = '/lcrc/group/e3sm/public_html/e3sm_diags_test_data/unit_test_complete_run/obs/climatology'
  climo_diurnal_subsection = "atm_monthly_diurnal_8xdaily_180x360_aave"
  climo_diurnal_frequency = "diurnal_8xdaily"
  output_format_subplot = "pdf",

[global_time_series]
active = True
atmosphere_only = True
years = "2010-2039", 
ts_num_years = 30
figstr = "run.v2.LR.F2010.ospa"
experiment_name = "run.v2.LR.F2010.ospa"
ts_years = "2010-2039",
climo_years = "2010-2039",

[chemdyg]
active = True
short_name = 'run.v2.LR.F2010.ospa'
years = "2010:2039:30",
ncfile_save = 'true'

  [[ index ]]
  grid = 'native'
  nodes = 1

  [[ climo_diags ]]
  grid = 'native'

  [[ cmip_comparison ]]
  grid = '180x360_aave'
  nodes = 1

  [[ noaa_co_comparison ]]
  grid = '180x360_aave'
  nodes = 1

  [[ o3_hole_diags ]]
  grid = 'native'
  input_files = "eam.h1"
  frequency = "daily"

  [[ TOZ_eq_native ]]
  grid = 'native'
  input_files = "eam.h1"
  frequency = "daily"

  [[ surf_o3_diags ]]
  grid1 = 'MDA8EU1.0x1.0_nco'
  grid2 = 'MDA8US1.0x1.0_nco'

  [[ STE_flux_native ]]
  grid = 'native'
  input_files = "eam.h5"

  [[ summary_table_native ]]
  grid = 'native'
  input_files = "eam.h5"

  [[ pres_lat_plots ]]
  grid = '180x360_aave'
  nodes = 1

  [[ lat_lon_plots ]]
  grid = '180x360_aave'
  nodes = 1

  [[ nox_emis_plots ]]
  grid = '180x360_aave'
  nodes = 1
  